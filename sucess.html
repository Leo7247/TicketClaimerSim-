
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NOVA - Success</title>

<style>

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f4f9;
    font-family: Arial, sans-serif;
    color: #202b3c;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 18px;
    width: 85%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 10px 30px #00000012;
}

.check {
    background: #e5f7ed;
    color: #137a4b;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    margin: 0 auto 20px;
}

.result {
    background: #f1f4f9;
    padding: 15px;
    border-radius: 10px;
    margin: 20px 0;
    overflow-wrap: anywhere;
}

button {
    background: #2463eb;
    color: white;
    padding: 13px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="card">

    <div class="check">✓</div>

    <h1>Success!</h1>

    <p>Your action was completed successfully.</p>

    <div class="result">

        <strong>Action:</strong>

        <span id="actionName"></span>

    </div>

    <h2>DONE!</h2>

    <p>NOVA should recognize this page as the success screen.</p>

    <button onclick="window.location.href='index.html'">
        Back to website
    </button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const action = params.get("action") || "Demo action";

document.getElementById("actionName").textContent = action;

document.title = "Success - " + action;

</script>

</body>
</html>
